<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 520" role="img" aria-labelledby="title desc">
  <title id="title">Petal flower</title>
  <desc id="desc">A large minimal pink flower with evenly spaced petals.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#831843" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect x="32" y="24" width="676" height="472" rx="56" fill="#fff1f2"/>

  <g filter="url(#shadow)">
    <g fill="#ec4899">
      <ellipse cx="370" cy="156" rx="54" ry="96"/>
      <ellipse cx="370" cy="156" rx="54" ry="96" transform="rotate(72 370 262)"/>
      <ellipse cx="370" cy="156" rx="54" ry="96" transform="rotate(144 370 262)"/>
      <ellipse cx="370" cy="156" rx="54" ry="96" transform="rotate(216 370 262)"/>
      <ellipse cx="370" cy="156" rx="54" ry="96" transform="rotate(288 370 262)"/>
    </g>
    <circle cx="370" cy="262" r="56" fill="#facc15"/>
  </g>
</svg>
