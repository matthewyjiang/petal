name: Real ROS smoke

on:
  workflow_dispatch:

jobs:
  humble:
    runs-on: ubuntu-latest
    container:
      image: osrf/ros:humble-desktop
      options: --user root
    env:
      PETAL_REAL_ROS_SMOKE: "1"
      ROS_DISTRO: humble
    steps:
      - uses: actions/checkout@v4
      - name: Install smoke dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            curl \
            python3-colcon-common-extensions \
            python3-rosdep \
            python3-venv
          command -v rosdep >/dev/null || apt-get install -y --no-install-recommends python3-rosdep
          rosdep init 2>/dev/null || true
          rosdep update --rosdistro "$ROS_DISTRO"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install petal with colcon verb
        run: |
          . "$HOME/.local/bin/env"
          uv pip install --system --editable ".[colcon]"
      - name: Run real ROS smoke
        run: |
          . "$HOME/.local/bin/env"
          source "/opt/ros/$ROS_DISTRO/setup.bash"
          tests/integration/real_ros_smoke.sh
