name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Tests, lint, and types
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run Ruff lint
        run: uv run --extra quality ruff check .

      - name: Run Ruff format check
        run: uv run --extra quality ruff format --check .

      - name: Run basedpyright type check
        run: uv run --extra quality basedpyright

      - name: Run tests
        run: uv run --extra test pytest -q
