[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "petal"
version = "0.1.0"
description = "Workspace-scoped Python dependency manager for ROS2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "packaging>=24",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
petal = "petal.cli:main"

[project.entry-points."colcon_core.verb"]
deps = "petal.colcon_ext.verb:DepsVerb"

[tool.pytest.ini_options]
testpaths = ["tests"]
