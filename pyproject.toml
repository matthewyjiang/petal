[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "petal-ros"
version = "0.1.1"
description = "Workspace-scoped Python dependency manager for ROS2"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Matthew Jiang" }]
dependencies = [
  "packaging>=24",
  "tomli>=2; python_version < '3.11'",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Build Tools",
]

[project.optional-dependencies]
colcon = ["colcon-core>=0.15"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/matthewyjiang/petal"
Repository = "https://github.com/matthewyjiang/petal"
Issues = "https://github.com/matthewyjiang/petal/issues"

[project.scripts]
petal = "petal.cli:main"

[project.entry-points."colcon_core.verb"]
deps = "petal.colcon_ext.verb:DepsVerb"

[tool.hatch.build.targets.wheel]
packages = ["petal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
